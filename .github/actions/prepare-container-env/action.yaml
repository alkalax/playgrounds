name: Prepare Container Environment
description: Install prerequisites and generate values for caching

outputs:
  distro-id:
    description: "Detected Linux Distribution"
    value: ${{ steps.detect-distro.outputs.distro-id }}

runs:
  using: composite
  steps:
    - name: Install GNU tools
      shell: sh
      run: |
        prerequisites=""
        if ! which tar >/dev/null 2>&1 || tar --help >/dev/null 2>&1 | grep -q "BusyBox"; then
          echo "Valid GNU tar command not found."
          prerequisites="tar"
        fi

        #if ! which source >/dev/null 2>&1; then
        #  echo "source command not found."
        #  prerequisites="${prerequisites} source"
        #fi

        for pkg in $prerequisites ; do
          echo "Installing ${pkg}..."

          if which apk >/dev/null 2>&1; then
            apk add --no-cache $pkg
          elif which apt-get >/dev/null 2>&1; then
            apt-get install -y $pkg
          elif which dnf >/dev/null 2>&1; then
            dnf install -y $pkg
          elif which yum >/dev/null 2>&1; then
            yum install -y $pkg
          else
            echo "Unknown package manager. Could not install ${pkg}."
            exit 1
          fi

          echo "Installation successful."
        done

    - name: Detect Linux Distribution
      id: detect-distro
      shell: sh
      run: |
        DISTRO="unknown"
        if [ -f "/etc/os-release" ]; then
          DISTRO=$(grep -E '^ID=' /etc/os-release | cut -d= -f2 | tr -d '"')
        fi
        echo "Distribution: ${DISTRO}"

        echo "distro-id=${DISTRO}" >> $GITHUB_OUTPUT
