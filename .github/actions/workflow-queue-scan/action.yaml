name: Workflow Queue Scan
description: Searches for required runners for workflows
inputs:
  github_token:
    required: true

runs:
  using: composite
  steps:
    - name: Install GNU tools
      shell: sh
      run: |
        prerequisites=""
        if ! which tar >/dev/null 2>&1 || tar --help >/dev/null 2>&1 | grep -q "BusyBox"; then
          echo "Valid GNU tar command not found."
          prerequisites="tar"
        fi

        #if ! which source >/dev/null 2>&1; then
        #  echo "source command not found."
        #  prerequisites="${prerequisites} source"
        #fi

        for pkg in $prerequisites ; do
          echo "Installing ${pkg}..."

          if which apk >/dev/null 2>&1; then
            apk add --no-cache $pkg
          elif which apt-get >/dev/null 2>&1; then
            apt-get install -y $pkg
          elif which dnf >/dev/null 2>&1; then
            dnf install -y $pkg
          elif which yum >/dev/null 2>&1; then
            yum install -y $pkg
          else
            echo "Unknown package manager. Could not install ${pkg}."
            exit 1
          fi

          echo "Installation successful."
        done

    - name: Generate dependency hash
      id: generate-hash
      shell: sh
      run: |
        DISTRO_ID=$(grep -E '^ID=' /etc/os-release | cut -d= -f2 | tr -d '"')
        echo "distro-id=${DISTRO_ID}" >> $GITHUB_OUTPUT

        HASH=$(md5sum "${GITHUB_ACTION_PATH}/requirements.txt" | awk '{ print $1 }')
        echo "hash=${HASH}" >> $GITHUB_OUTPUT

    - name: Cache virtual environment
      id: cache-venv
      uses: actions/cache@v5
      with:
        path: .venv
        key: workflow-scan-${{ steps.generate-hash.outputs.distro-id }}-${{ steps.generate-hash.outputs.hash }}
        restore-keys: |
          workflow-scan-${{ steps.generate-hash.outputs.distro-id }}-

    - name: Install dependencies
      if: steps.cache-venv.outputs.cache-hit != 'true'
      shell: sh
      run: |
        python -m venv .venv
        . .venv/bin/activate
        pip install --no-cache-dir -r "${GITHUB_ACTION_PATH}/requirements.txt"

    - name: Run script
      shell: sh
      env: 
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        . .venv/bin/activate
        python "${GITHUB_ACTION_PATH}/main.py"
