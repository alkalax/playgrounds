{{define "base"}}
<!DOCTYPE html>
<html>
  <head>
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-10">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow text-center">
      <h1 class="text-xl font-bold mb-4">VM shutdown settings</h1>
      {{template "dropdown" .}}

      <div id="vm-details" class="mt-6 text-left bg-slate-50 rounded-lg p-4">
        {{with .Selected}}
        <div class="grid grid-cols-2 gap-x-4 gap-y-2 items-center text-sm text-gray-700">
          <span class="font-medium text-gray-600">Name</span>
          <span class="text-right font-semibold text-gray-900">{{.Name}}</span>
          <span class="font-medium text-gray-600">Next Shutdown</span>
          <span class="text-right text-gray-900">{{if .SkipToday}}Tomorrow{{else}}Today{{end}} at {{.ShutdownTime.Format "15:04"}} CET</span>
        </div>
        {{else}}
        <p class="text-sm text-gray-600">Choose a VM from the menu above to see its shutdown time.</p>
        {{end}}
      </div>
    </div>
  </body>
</html>
{{end}}
